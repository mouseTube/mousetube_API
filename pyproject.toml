[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mousetube_api"
version = "1.0"
description = "mousetube allows the exchange of mouse vocalisation recording files."
authors = [
    { name = "Nicolas Torquet", email = "nicolas.torquet@igbmc.com" },
    { name = "Laurent Bouri", email = "laurent.bouri@igbmc.fr" },
]
dependencies = [
    "Django==5.2.19",
    "djangorestframework==3.18.3",
    "djangorestframework-simplejwt>=5.5.1,<6",
    "djoser==2.3.5",
    "django-cors-headers==4.9.0",
    "mysqlclient==2.3.0",
    "django-environ==0.14.0",
    "drf-spectacular==0.30.0",
    "uvicorn==0.54.0",
    "gunicorn==26.2.0",
    "django-countries==9.1.0",
    "setuptools>=82",
    "pillow==13.0.0",
    "celery[redis]==5.6.3",
    "django-celery-results==2.6.0",
    "celery-progress==0.5",
    "django-extensions==4.1",
    "django-allauth==65.21.1",
    "django-filter==26.2",
    "soundfile==0.14.0",
]
license = { text = "GPL-3.0" }

[project.optional-dependencies]
dev = ["pytest", "ruff"]
docs = ["mkdocs-material>=8.0", "mkdocstrings[python]>=0.11"]

[project.scripts]
mousetube_api = "mousetube_api:manage"

[tool.setuptools.packages.find]
include = ["mousetube_api*"]

[tool.dependencies]
mkdocs-material = ">=8.0"
mkdocstrings = { version = ">=0.11", extras = ["python"] }

[tool.ruff.lint]
# Django/DRF class attributes (choices, permission_classes, fields...) are lists by convention.
ignore = ["RUF012"]
