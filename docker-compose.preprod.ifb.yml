services:
  db:
    image: mariadb:12.2
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  web:
    build:
      context: .
    command: /entrypoint.sh
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      DB_HOST: db
      FIXTURE_FILE: /app/exported_data.json
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped

  frontend:
    build: ../mousetube_frontend
    command: /entrypoint.sh
    volumes:
      - ../mousetube_frontend:/app
    expose:
      - "3000"
    depends_on:
      - web
    env_file:
      - ../mousetube_frontend/.env
    environment:
      - NPM_CONFIG_CACHE=/app/.npm
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped

  celery:
    build:
      context: .
    entrypoint: [""]
    command: celery -A mousetube_api worker -l info
    volumes:
      - .:/app
    depends_on:
      - db
      - web
      - redis
    env_file:
      - .env
    environment:
      DB_HOST: db
    user: "${UID:-1000}:${GID:-1000}"
    restart: always

  redis:
    image: redis:7
    # appendonly + volume: queued tasks survive a restart or a re-creation of the container
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always
    expose:
      - "6379"

  nginx:
    build:
      context: ./nginx
    volumes:
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./logs/nginx:/var/log/nginx
    # no published port: haproxy is the entry point, as in production
    expose:
      - "80"
    depends_on:
      - frontend
      - web
    environment:
      DOMAIN: ${DOMAIN}
    restart: always

  # Makes the self-signed certificate of haproxy in a volume, once. It is made again when it is
  # missing, when it expires within 30 days, or when DOMAIN is not in it any more (restart haproxy
  # after that, it reads the certificate when it starts).
  haproxy-cert:
    image: alpine/openssl
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        D="${DOMAIN:-mousetube.ifb.local}"
        F=/certs/mousetube.pem
        if [ -s "$$F" ] && openssl x509 -checkend 2592000 -noout -in "$$F" >/dev/null 2>&1 \
           && openssl x509 -noout -ext subjectAltName -in "$$F" | grep -q "DNS:$$D"; then
          echo "certificate of $$D is there"; exit 0
        fi
        openssl req -x509 -newkey rsa:2048 -nodes -days 825 -subj "/CN=$$D" \
          -addext "subjectAltName=DNS:$$D" -keyout /tmp/key.pem -out /tmp/cert.pem
        cat /tmp/cert.pem /tmp/key.pem > "$$F"
        chmod 644 "$$F"   # haproxy runs as another user than root
        echo "certificate of $$D made"
    volumes:
      - haproxy_certs:/certs
    restart: "no"

  haproxy:
    image: haproxy:lts-alpine
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - haproxy_certs:/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      haproxy-cert:
        condition: service_completed_successfully
      nginx:
        condition: service_started
    restart: always

volumes:
  mariadb_data:
  redis_data:
  haproxy_certs:
