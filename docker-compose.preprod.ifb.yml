services:
  db:
    image: mariadb:12.2
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:${DB_PORT}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

  web:
    build:
      context: .
    command: /entrypoint.sh
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      DB_HOST: db
      FIXTURE_FILE: /app/exported_data.json
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped

  frontend:
    build: ../mousetube_frontend
    command: /entrypoint.sh
    volumes:
      - ../mousetube_frontend:/app
    expose:
      - "3000"
    depends_on:
      - web
    env_file:
      - ../mousetube_frontend/.env
    environment:
      - NPM_CONFIG_CACHE=/app/.npm
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped

  celery:
    build:
      context: .
    entrypoint: [""]
    command: celery -A mousetube_api worker -l info
    volumes:
      - .:/app
    depends_on:
      - db
      - web
      - redis
    env_file:
      - .env
    environment:
      DB_HOST: db
    user: "${UID:-1000}:${GID:-1000}"
    restart: always

  redis:
    image: redis:7
    # appendonly + volume: queued tasks survive a restart or a re-creation of the container
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    restart: always
    expose:
      - "6379"

  nginx:
    build:
      context: ./nginx
    volumes:
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./logs/nginx:/var/log/nginx
    # no published port: haproxy is the entry point, as in production
    expose:
      - "80"
    depends_on:
      - frontend
      - web
    environment:
      DOMAIN: ${DOMAIN}
    restart: always

  haproxy:
    image: haproxy:lts-alpine
    # run haproxy/gen-cert.sh once to make haproxy/certs/mousetube.pem (self-signed)
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./haproxy/certs:/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - nginx
    restart: always

volumes:
  mariadb_data:
  redis_data:
