# Local HAProxy of the pre-production: it plays the role of the HAProxy that sits in front of nginx in
# production (it ends the TLS and tells Django that the request was https), so that nginx and Django
# are configured the same way in both places.
#
#   browser --https:443--> haproxy --http--> nginx:80 --> web / frontend
#   HAProxy of the IFB --http:80--> haproxy --http--> nginx:80   (already https upstream)

global
    log stdout format raw local0 info
    maxconn 2000
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout http-request 30s
    # a file of several GiB goes through here: do not cut a slow upload or a long answer
    timeout client 10m
    timeout server 10m

# Direct access (the self-signed certificate that the haproxy-cert service makes in a volume).
# option forwardfor adds the visitor's address to X-Forwarded-For, as the HAProxy of production does.
frontend https_in
    bind :443 ssl crt /certs/mousetube.pem
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    default_backend nginx

# Through the HAProxy of the IFB: it already added X-Forwarded-For and X-Forwarded-Proto: https,
# so nothing is added or redirected here (a request without the header is sent to https by Django).
frontend http_in
    bind :80
    default_backend nginx

# The Docker DNS: nginx may be recreated (new address) or not be up yet when haproxy starts.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

backend nginx
    server nginx nginx:80 check resolvers docker init-addr libc,none
