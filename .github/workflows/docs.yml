name: 📚 Documentation

on:
  # build (and check) the documentation of every pull request that touches it
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "mousetube_api/**/*.py"
      - ".github/workflows/docs.yml"
  # publish it when main changes
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "mousetube_api/**/*.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# one publication at a time; a newer one replaces the one in progress
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 🏗️ Build the site
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: 📦 Install MkDocs and its plugins
        run: pip install -r requirements-docs.txt

      # a broken link, a missing page or an unknown anchor fails the build
      - name: 🏗️ Build (strict)
        env:
          NO_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict

      - name: 📤 Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: 🚀 Publish on GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy
        id: deployment
        uses: actions/deploy-pages@v4
